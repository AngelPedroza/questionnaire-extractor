[project]
name = "questionary-extractor"
version = "0.1.0"
description = "Extracts questionnaire items from PDF, DOCX and XLSX files into structured JSON."
readme = "README.md"
authors = [
    { name = "Angel Pedroza", email = "angelomarpedrozacardenas@gmail.com" }
]
requires-python = "==3.13.*"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "google-genai>=2.34.0",
    "ollama>=0.6.3",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.16.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
